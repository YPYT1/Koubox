[prompts]
ja = "日本語のテクノロジー市場解説。速報、特定銘柄、売買推奨、公開情報、AI芯片、封止材、歩留まり、組み込みソフト、エッジAI、通信モジュール、ロボット減速機、静音性、LiDAR、清掃、曇り、高積層化、プローブ、光学ステージ、保守サービス、納期、工場設備、店舗機器、小型半導体、推論チップ、メモリー、PoC、在庫、研究開発負担、数字との照合、本稿、テーマ解説。"
zh = ""
en = ""
ko = ""

# 当前值来自 2026-08-29 日文本地回归和初始四语工程假设。
# FLEURS validation 标定完成前，发布验收状态保持“未完成”。
[speech_rate_thresholds]
version = 2
# FLEURS validation 四语各 30 条，经相对峰值 VAD 标定得到的 q90 候选值。
zh = 5.74
en = 3.26
ja = 6.76
ko = 6.11

