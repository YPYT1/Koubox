[project]
name = "koubox-runtime"
version = "0.1.0"
description = "口播匣本地模型运行时"
requires-python = ">=3.11,<3.14"
dependencies = [
  "accelerate>=1.10.0",
  "numpy>=2.2.0",
  "safetensors>=0.5.0",
  "torch>=2.7.0",
  "transformers>=5.6.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koubox_runtime"]
