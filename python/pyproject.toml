[project]
name = "koubox-runtime"
version = "0.1.0"
description = "口播匣本地模型运行时"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2.0",
  "safetensors>=0.5.0",
  "torch>=2.11.0",
  "torchaudio>=2.5.0",
  "demucs>=4.0.1",
  "faster-whisper>=1.2.1",
  "soundfile>=0.12.1",
  "transformers>=5.6.0",
  "yt-dlp>=2026.7.4",
  "curl_cffi>=0.16,<1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koubox_runtime"]

[tool.uv.sources]
torch = { path = "wheels/torch-2.11.0+cu128-cp312-cp312-win_amd64.whl" }
