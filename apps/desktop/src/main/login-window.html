<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录视频平台</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #f3f4f6;
        color: #111827;
      }
      .wrap {
        max-width: 720px;
        margin: 48px auto;
        padding: 0 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0 0 24px;
        color: #4b5563;
        line-height: 1.6;
      }
      .links {
        display: grid;
        gap: 12px;
      }
      .platform-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid #e5e7eb;
      }
      .platform-row a {
        flex: 1;
        color: #111827;
        text-decoration: none;
        font-weight: 600;
      }
      .platform-row a:hover {
        color: #059669;
      }
      .status-badge {
        flex-shrink: 0;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid #e5e7eb;
        background: #f9fafb;
        color: #6b7280;
      }
      .status-badge.ok {
        border-color: #6ee7b7;
        background: #ecfdf5;
        color: #047857;
      }
      .status-badge.warn {
        border-color: #fcd34d;
        background: #fffbeb;
        color: #b45309;
      }
      .tip {
        margin-top: 24px;
        padding: 14px 16px;
        border-radius: 10px;
        background: #fffbeb;
        border: 1px solid #fde68a;
        color: #92400e;
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>登录视频平台</h1>
      <p>点击下方链接，在新窗口中依次登录各平台。登录后关闭子窗口，此处状态会自动更新。全部完成后回到全局设置点击「保存登录状态」。</p>
      <div class="links">
        <div class="platform-row">
          <a href="https://www.youtube.com" target="_blank" rel="noreferrer">YouTube</a>
          <span class="status-badge" id="status-youtube">检测中…</span>
        </div>
        <div class="platform-row">
          <a href="https://www.tiktok.com" target="_blank" rel="noreferrer">TikTok</a>
          <span class="status-badge" id="status-tiktok">检测中…</span>
        </div>
        <div class="platform-row">
          <a href="https://www.instagram.com" target="_blank" rel="noreferrer">Instagram</a>
          <span class="status-badge" id="status-instagram">检测中…</span>
        </div>
        <div class="platform-row">
          <a href="https://www.facebook.com" target="_blank" rel="noreferrer">Facebook</a>
          <span class="status-badge" id="status-facebook">检测中…</span>
        </div>
      </div>
      <div class="tip">登录完成后请关闭此窗口，回到「全局设置 → 下载（yt-dlp）」点击「保存登录状态」，再点「检测登录状态」确认。</div>
    </div>
    <script>
      async function refreshStatus() {
        if (!window.loginHub) return
        const status = await window.loginHub.getStatus()
        for (const platform of status.platforms) {
          const badge = document.getElementById(`status-${platform.id}`)
          if (!badge) continue
          badge.textContent = platform.loggedIn ? '已登录' : (platform.id === 'instagram' ? '未进入主页' : '未登录')
          badge.title = platform.detail
          badge.className = `status-badge ${platform.loggedIn ? 'ok' : 'warn'}`
        }
      }
      refreshStatus()
      setInterval(refreshStatus, 2000)
    </script>
  </body>
</html>
